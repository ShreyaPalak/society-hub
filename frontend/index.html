<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Society Hub</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="root"></div>

  <!--
    No build step: React + Babel are loaded from CDN and app.js is
    transpiled in the browser. This keeps the frontend deployable as
    static files (see README "Running without a bundler"). For a
    production build, swap this for a Vite/CRA setup that compiles
    js/app.js ahead of time.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js" crossorigin></script>

  <script>
    // Point the frontend at your API server. Override before app.js loads
    // if the backend isn't on localhost:4000.
    window.SOCIETY_HUB_API_BASE = window.SOCIETY_HUB_API_BASE || 'http://localhost:4000/api';
  </script>
  <script src="js/api.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
